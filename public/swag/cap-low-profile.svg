<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 220" role="img" aria-label="Navy low-profile dad cap, front view">
  <defs>
    <linearGradient id="crown" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c4374"/>
      <stop offset="55%" stop-color="#11335d"/>
      <stop offset="100%" stop-color="#0a2245"/>
    </linearGradient>
    <linearGradient id="visor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#11335d"/>
      <stop offset="100%" stop-color="#06182f"/>
    </linearGradient>
  </defs>

  <!-- Crown: low-profile dome -->
  <path d="M40,138 Q40,52 140,52 Q240,52 240,138 Z"
        fill="url(#crown)" stroke="#06182f" stroke-width="2"/>

  <!-- 6-panel seams (subtle) -->
  <path d="M140,52 L140,138" stroke="#06182f" stroke-width="1" opacity="0.35" fill="none"/>
  <path d="M86,60 Q96,100 96,138" stroke="#06182f" stroke-width="1" opacity="0.35" fill="none"/>
  <path d="M194,60 Q184,100 184,138" stroke="#06182f" stroke-width="1" opacity="0.35" fill="none"/>

  <!-- Eyelets -->
  <circle cx="115" cy="82" r="1.6" fill="#06182f"/>
  <circle cx="165" cy="82" r="1.6" fill="#06182f"/>

  <!-- Top button -->
  <circle cx="140" cy="55" r="3.2" fill="#06182f"/>

  <!-- Sweatband / hat-band line -->
  <path d="M40,138 Q140,144 240,138" stroke="#06182f" stroke-width="2" opacity="0.55" fill="none"/>

  <!-- Visor (curved bill) -->
  <path d="M28,138 Q140,196 252,138 Q140,182 28,138 Z"
        fill="url(#visor)" stroke="#000" stroke-width="1.5"/>
  <path d="M40,141 Q140,182 240,141"
        stroke="#06182f" stroke-width="1" opacity="0.45" fill="none"/>
</svg>
